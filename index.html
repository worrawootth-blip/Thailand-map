<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่ประเทศไทยรายจังหวัด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --danger: #b91c1c;
    --font: Sarabun, "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header { padding: 20px 24px 4px; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 2px 0 0; color: var(--muted); }
  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px 40px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .panel { position: sticky; top: 16px; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid #93c5fd; border-color: #60a5fa; }
  .opts { display: grid; grid-template-columns: 1fr 120px; gap: 10px; margin-bottom: 14px; }
  .rows-head, .row {
    display: grid;
    grid-template-columns: 1fr 108px 34px;
    gap: 8px;
    align-items: center;
  }
  .rows-head { font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  #rows { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; padding: 2px 4px 2px 0; }
  .row button.rm {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font-size: 1.1rem; cursor: pointer;
  }
  .row button.rm:hover { color: var(--danger); border-color: #fca5a5; }
  button { font: inherit; cursor: pointer; }
  .btn {
    padding: 9px 14px; border-radius: 9px; border: 1px solid #cbd5e1;
    background: #fff; color: var(--ink); font-weight: 600;
  }
  .btn:hover:not(:disabled) { background: #f1f5f9; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: #1e40af; }
  .btn.add { width: 100%; margin-top: 10px; border-style: dashed; color: var(--accent); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .actions .primary { grid-column: 1 / -1; padding: 11px; font-size: 1.05rem; }
  .combo input.invalid { border-color: #f87171; background: #fef2f2; }
  #pop {
    position: fixed; z-index: 50; display: none; max-height: 240px; overflow-y: auto;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(15,23,42,.18); padding: 4px; margin: 0; list-style: none;
  }
  #pop li { padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  #pop li.active { background: #dbeafe; }
  #pop li.none { color: var(--muted); cursor: default; }
  #pop mark { background: #fde68a; color: inherit; border-radius: 2px; }
  .toggles { display: grid; gap: 10px; margin-top: 14px; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: .95rem; cursor: pointer; user-select: none; position: relative; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 40px; height: 22px; border-radius: 22px; background: #cbd5e1; position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid #93c5fd; outline-offset: 2px; }
  #status { min-height: 1.4em; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  #status.err { color: var(--danger); }
  #status.ok { color: #047857; }
  .map-card { padding: 12px; text-align: center; }
  #stage svg { width: 100%; max-width: 820px; height: auto; display: block; margin: 0 auto; }
  #stage path { transition: opacity .12s; }
  #stage path:hover { opacity: .8; stroke: #111827; stroke-width: 1.4; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; padding: 12px; }
    .panel { position: static; }
    #rows { max-height: none; }
    header { padding: 16px 12px 0; }
  }
</style>
</head>
<body>
<header>
  <h1>แผนที่ประเทศไทยรายจังหวัด</h1>
  <p>เลือกจังหวัด ใส่จำนวน แล้วกด “ประมวลผล” เพื่อระบายสีตามขนาดของจำนวน (เข้ม = มาก, อ่อน = น้อย)</p>
</header>

<main class="app">
  <section class="card panel">
    <div class="opts">
      <div>
        <label class="field" for="title">หัวข้อแผนที่</label>
        <input type="text" id="title" value="แผนที่ประเทศไทย" maxlength="60">
      </div>
      <div>
        <label class="field" for="theme">โทนสี</label>
        <select id="theme"></select>
      </div>
    </div>

    <div class="rows-head"><span>จังหวัด</span><span>จำนวน</span><span></span></div>
    <div id="rows"></div>
    <button class="btn add" id="addBtn" type="button">+ เพิ่มจังหวัด</button>

    <div class="toggles">
      <label class="switch"><input type="checkbox" id="showValues" checked><span class="track"></span>แสดงตัวเลขจำนวนบนแผนที่</label>
      <label class="switch"><input type="checkbox" id="showAll" checked><span class="track"></span>แสดงชื่อจังหวัดอื่น ๆ ทั้งหมด</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="runBtn" type="button">ประมวลผล</button>
      <button class="btn" id="dlBtn" type="button" disabled>ดาวน์โหลด PNG</button>
      <button class="btn" id="resetBtn" type="button">รีเซ็ตข้อมูล</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section class="card map-card">
    <div id="stage"></div>
  </section>
</main>

const FONT = "Sarabun, 'Noto Sans Thai', Tahoma, 'Leelawadee UI', sans-serif";
const EMPTY_FILL = '#e5e7eb';
const DEFAULT_ROWS = 3;

const THEMES = {
  blue:   { label: 'ฟ้า',   stops: ['#c9def5', '#8fbbe8', '#4f90d0', '#2459a6', '#0a2a5e'] },
  red:    { label: 'แดง',   stops: ['#fbd3c6', '#f6a08a', '#e8624a', '#b52a22', '#5f0a12'] },
  green:  { label: 'เขียว', stops: ['#cdeac6', '#97d392', '#52ae65', '#1f7f40', '#073d1c'] },
  purple: { label: 'ม่วง',  stops: ['#dcd3ee', '#b7a5dc', '#8a6fc0', '#5a3a96', '#2a1360'] },
  orange: { label: 'ส้ม',   stops: ['#fde0b8', '#f9bc72', '#ee8d2e', '#c35a0b', '#6a2a02'] }
};

const NAMES = MAP.provinces.map(p => p.n).sort((a, b) => a.localeCompare(b, 'th'));

const $ = id => document.getElementById(id);
const rowsEl = $('rows'), statusEl = $('status');
let lastScene = null;   // scene of the last processed map (used for PNG export)

/* ---------- helpers ---------- */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(c) { return '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
function colorAt(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const seg = t * (stops.length - 1), i = Math.min(Math.floor(seg), stops.length - 2), f = seg - i;
  const a = hexToRgb(stops[i]), b = hexToRgb(stops[i + 1]);
  return rgbToHex(a.map((v, k) => v + (b[k] - v) * f));
}
function luminance(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function fmt(v) { return Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ''; }

/* ---------- input rows (type-to-search province boxes) ---------- */
const MAX_ROWS = NAMES.length;   // 77 — each province can be used once
const pop = document.createElement('ul');
pop.id = 'pop';
document.body.appendChild(pop);
let popInput = null, popItems = [], popIdx = -1;

function chosenElsewhere(except) {
  const set = new Set();
  rowsEl.querySelectorAll('input.prov').forEach(i => {
    const t = i.value.trim();
    if (i !== except && NAMES.includes(t)) set.add(t);
  });
  return set;
}
function candidates(input) {
  const taken = chosenElsewhere(input);
  const t = input.value.trim();
  const exact = NAMES.includes(t);
  let list = NAMES.filter(n => !taken.has(n));
  if (t && !exact) {
    const starts = list.filter(n => n.startsWith(t));
    const rest = list.filter(n => !n.startsWith(t) && n.includes(t));
    list = starts.concat(rest);
  }
  return { list, q: exact ? '' : t };
}
function renderPop(q) {
  if (!popItems.length) { pop.innerHTML = '<li class="none">ไม่พบจังหวัดที่ตรงกัน</li>'; return; }
  pop.innerHTML = popItems.map((n, i) => {
    let label = esc(n);
    const k = q ? n.indexOf(q) : -1;
    if (k >= 0) label = esc(n.slice(0, k)) + '<mark>' + esc(q) + '</mark>' + esc(n.slice(k + q.length));
    return `<li data-i="${i}" class="${i === popIdx ? 'active' : ''}">${label}</li>`;
  }).join('');
}
function placePop() {
  if (!popInput) return;
  const r = popInput.getBoundingClientRect();
  pop.style.left = r.left + 'px';
  pop.style.width = r.width + 'px';
  pop.style.top = (r.bottom + 4) + 'px';
  const h = pop.offsetHeight;
  if (r.bottom + 4 + h > window.innerHeight && r.top - 4 - h > 0) pop.style.top = (r.top - 4 - h) + 'px';
}
function openPop(input) {
  popInput = input;
  const { list, q } = candidates(input);
  popItems = list;
  popIdx = list.length && q ? 0 : -1;
  renderPop(q);
  pop.style.display = 'block';
  placePop();
}
function closePop() { pop.style.display = 'none'; popInput = null; popIdx = -1; }
function moveActive(d) {
  if (!popItems.length) return;
  popIdx = popIdx < 0 ? (d > 0 ? 0 : popItems.length - 1) : (popIdx + d + popItems.length) % popItems.length;
  [...pop.children].forEach((li, i) => li.classList.toggle('active', i === popIdx));
  if (pop.children[popIdx] && pop.children[popIdx].scrollIntoView) pop.children[popIdx].scrollIntoView({ block: 'nearest' });
}
function numberOf(input) { return input.closest('.row').querySelector('input[type=number]'); }
function choose(input, name) {
  input.value = name;
  input.classList.remove('invalid');
  closePop();
  numberOf(input).focus();
}
// when leaving the box: accept an exact name, auto-complete a unique match, otherwise flag it
function commit(input) {
  const t = input.value.trim();
  input.classList.remove('invalid');
  if (!t) { input.value = ''; return; }
  if (NAMES.includes(t)) {
    if (chosenElsewhere(input).has(t)) {
      setStatus(`“${t}” ถูกเลือกไปแล้วในอีกแถวหนึ่ง`, 'err');
      input.value = '';
    } else input.value = t;
    return;
  }
  const c = candidates(input).list;
  if (c.length === 1) input.value = c[0];
  else input.classList.add('invalid');
}

pop.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the text box
pop.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]');
  if (li && popInput) choose(popInput, popItems[+li.dataset.i]);
});
window.addEventListener('scroll', e => { if (popInput && e.target !== pop) placePop(); }, true);
window.addEventListener('resize', () => { if (popInput) placePop(); });

function updateCount() {
  const n = rowsEl.children.length;
  $('addBtn').textContent = `+ เพิ่มจังหวัด (${n}/${MAX_ROWS})`;
  $('addBtn').disabled = n >= MAX_ROWS;
}

function addRow(prov = '', val = '') {
  if (rowsEl.children.length >= MAX_ROWS) return null;
  const row = document.createElement('div');
  row.className = 'row';

  const combo = document.createElement('div');
  combo.className = 'combo';
  const pin = document.createElement('input');
  pin.type = 'text';
  pin.className = 'prov';
  pin.placeholder = 'พิมพ์ค้นหาจังหวัด...';
  pin.autocomplete = 'off';
  pin.spellcheck = false;
  pin.setAttribute('role', 'combobox');
  pin.setAttribute('aria-label', 'จังหวัด');
  pin.value = prov;
  pin.addEventListener('focus', () => openPop(pin));
  pin.addEventListener('input', () => { pin.classList.remove('invalid'); openPop(pin); });
  pin.addEventListener('blur', () => { closePop(); commit(pin); });
  pin.addEventListener('keydown', e => {
    const open = pop.style.display === 'block' && popInput === pin;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (open) moveActive(1); else openPop(pin); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) moveActive(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (open && popIdx >= 0) choose(pin, popItems[popIdx]); else numberOf(pin).focus();
    }
    else if (e.key === 'Escape') closePop();
  });
  combo.appendChild(pin);

  const num = document.createElement('input');
  num.type = 'number';
  num.step = 'any';
  num.placeholder = 'จำนวน';
  num.setAttribute('aria-label', 'จำนวน');
  num.value = val;
  num.addEventListener('keydown', e => { if (e.key === 'Enter') process(); });

  const rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'rm';
  rm.title = 'ลบแถวนี้';
  rm.textContent = '×';
  rm.addEventListener('click', () => {
    if (rowsEl.children.length > 1) row.remove();
    else { pin.value = ''; pin.classList.remove('invalid'); num.value = ''; }
    updateCount();
  });

  row.append(combo, num, rm);
  rowsEl.appendChild(row);
  updateCount();
  return row;
}

function readRows() {
  const items = [], warnings = [], seen = new Set();
  [...rowsEl.children].forEach(row => {
    const text = row.querySelector('input.prov').value.trim();
    const prov = NAMES.includes(text) ? text : '';
    const raw = row.querySelector('input[type=number]').value.trim();
    const v = raw === '' ? NaN : Number(raw);
    if (prov && seen.has(prov)) warnings.push(`“${prov}” ซ้ำกัน`);
    else if (prov && Number.isFinite(v)) { items.push({ name: prov, value: v }); seen.add(prov); }
    else if (prov) warnings.push(`“${prov}” ยังไม่ได้ใส่จำนวน`);
    else if (text) warnings.push(`“${text}” ไม่ใช่ชื่อจังหวัดที่ถูกต้อง`);
    else if (raw !== '') warnings.push('มีแถวที่ใส่จำนวนแต่ยังไม่ได้เลือกจังหวัด');
  });
  return { items, warnings };
}

/* ---------- scene (shared by on-screen SVG and PNG export) ---------- */
function buildScene(items) {
  const theme = THEMES[$('theme').value] || THEMES.blue;
  const values = new Map(items.map(i => [i.name, i.value]));
  const nums = items.map(i => i.value);
  const min = nums.length ? Math.min(...nums) : 0;
  const max = nums.length ? Math.max(...nums) : 0;
  const showAll = $('showAll').checked;
  const showValues = $('showValues').checked;
  const W = MAP.w, H = MAP.h;
  const sc = { w: W, h: H, paths: [], texts: [], grads: [] };

  const fills = {};
  MAP.provinces.forEach(p => {
    let fill = EMPTY_FILL;
    if (values.has(p.n)) fill = colorAt(theme.stops, max === min ? 1 : (values.get(p.n) - min) / (max - min));
    fills[p.n] = fill;
    sc.paths.push({ d: p.d, fill, name: p.n, value: values.has(p.n) ? values.get(p.n) : null });
  });

  // other provinces (light, small) first, then selected ones on top
  if (showAll) {
    MAP.provinces.forEach(p => {
      if (values.has(p.n)) return;
      sc.texts.push({ x: p.x, y: p.y, t: p.n, size: p.bw < 45 ? 7.5 : 10, weight: 400, fill: '#6b7280', halo: EMPTY_FILL, anchor: 'middle' });
    });
  }
  MAP.provinces.forEach(p => {
    if (!values.has(p.n)) return;
    const f = fills[p.n];
    const dark = luminance(f) < 0.32;
    const fill = dark ? '#ffffff' : '#111827';
    const small = p.bw < 45;
    if (showValues) {
      sc.texts.push({ x: p.x, y: p.y - (small ? 5 : 7), t: p.n, size: small ? 10 : 13, weight: 700, fill, halo: f, anchor: 'middle' });
      sc.texts.push({ x: p.x, y: p.y + (small ? 6 : 8), t: fmt(values.get(p.n)), size: small ? 9.5 : 12, weight: 600, fill, halo: f, anchor: 'middle' });
    } else {
      sc.texts.push({ x: p.x, y: p.y, t: p.n, size: small ? 10 : 13, weight: 700, fill, halo: f, anchor: 'middle' });
    }
  });

  // title (top-right, the empty corner of the map)
  const title = $('title').value.trim();
  if (title) sc.texts.push({ x: W - 24, y: 34, t: title, size: 26, weight: 700, fill: '#111827', halo: '#ffffff', anchor: 'end' });

  // legend (bottom-left, over the Andaman Sea)
  if (items.length) {
    const lx = 24, ly = H - 66, lw = 230, lh = 14;
    sc.grads.push({ x: lx, y: ly, w: lw, h: lh, stops: theme.stops });
    sc.texts.push({ x: lx, y: ly - 14, t: 'จำนวน (เข้ม = มาก)', size: 12, weight: 600, fill: '#374151', halo: '#ffffff', anchor: 'start' });
    sc.texts.push({ x: lx, y: ly + lh + 14, t: fmt(min), size: 12, weight: 400, fill: '#374151', halo: '#ffffff', anchor: 'start' });
    sc.texts.push({ x: lx + lw, y: ly + lh + 14, t: fmt(max), size: 12, weight: 400, fill: '#374151', halo: '#ffffff', anchor: 'end' });
  }
  return sc;
}

function sceneToSVG(sc) {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sc.w} ${sc.h}" role="img" aria-label="แผนที่ประเทศไทยรายจังหวัด">`;
  s += `<defs>${sc.grads.map((g, i) =>
    `<linearGradient id="lg${i}" x1="0" x2="1" y1="0" y2="0">${g.stops.map((c, k) =>
      `<stop offset="${k / (g.stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>`).join('')}</defs>`;
  s += `<g stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round" fill-rule="evenodd">`;
  sc.paths.forEach(p => {
    const tip = p.value === null ? p.name : `${p.name}: ${fmt(p.value)}`;
    s += `<path d="${p.d}" fill="${p.fill}"><title>${esc(tip)}</title></path>`;
  });
  s += `</g>`;
  sc.grads.forEach((g, i) => { s += `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="3" fill="url(#lg${i})" stroke="#9ca3af" stroke-width=".6"/>`; });
  s += `<g font-family="${FONT}" dominant-baseline="central" style="pointer-events:none">`;
  sc.texts.forEach(t => {
    s += `<text x="${t.x}" y="${t.y}" font-size="${t.size}" font-weight="${t.weight}" text-anchor="${t.anchor}" fill="${t.fill}" stroke="${t.halo}" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${esc(t.t)}</text>`;
  });
  s += `</g></svg>`;
  return s;
}

async function sceneToPNG(sc, scale = 2.5) {
  // make sure Thai web font is ready before drawing on canvas
  try {
    await Promise.all([document.fonts.load('400 16px Sarabun', 'กขค'), document.fonts.load('700 16px Sarabun', 'กขค'), document.fonts.load('600 16px Sarabun', 'กขค')]);
  } catch (e) { /* fall back to system fonts */ }
  const cv = document.createElement('canvas');
  cv.width = Math.round(sc.w * scale);
  cv.height = Math.round(sc.h * scale);
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, sc.w, sc.h);

  ctx.lineJoin = 'round';
  sc.paths.forEach(p => {
    const path = new Path2D(p.d);
    ctx.fillStyle = p.fill;
    ctx.fill(path, 'evenodd');
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.9;
    ctx.stroke(path);
  });
  sc.grads.forEach(g => {
    const gr = ctx.createLinearGradient(g.x, 0, g.x + g.w, 0);
    g.stops.forEach((c, k) => gr.addColorStop(k / (g.stops.length - 1), c));
    ctx.fillStyle = gr;
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 0.6;
    ctx.strokeRect(g.x, g.y, g.w, g.h);
  });
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  sc.texts.forEach(t => {
    ctx.font = `${t.weight} ${t.size}px ${FONT}`;
    ctx.textAlign = t.anchor === 'middle' ? 'center' : t.anchor === 'end' ? 'right' : 'left';
    ctx.lineWidth = 3;
    ctx.strokeStyle = t.halo;
    ctx.strokeText(t.t, t.x, t.y);
    ctx.fillStyle = t.fill;
    ctx.fillText(t.t, t.x, t.y);
  });
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

/* ---------- actions ---------- */
function render(items) {
  const sc = buildScene(items);
  $('stage').innerHTML = sceneToSVG(sc);
  return sc;
}

function process() {
  const { items, warnings } = readRows();
  if (!items.length) {
    setStatus('กรุณาเลือกจังหวัดและใส่จำนวนอย่างน้อย 1 จังหวัด', 'err');
    return;
  }
  lastScene = render(items);
  $('dlBtn').disabled = false;
  const note = warnings.length ? ` (ข้าม: ${[...new Set(warnings)].join(', ')})` : '';
  setStatus(`ประมวลผลเรียบร้อย — ${items.length} จังหวัด${note}`, warnings.length ? '' : 'ok');
}

async function download() {
  if (!lastScene) return;
  const btn = $('dlBtn');
  btn.disabled = true;
  try {
    const blob = await sceneToPNG(lastScene);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'thailand-map.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setStatus('ดาวน์โหลดไฟล์ thailand-map.png แล้ว', 'ok');
  } catch (e) {
    setStatus('ดาวน์โหลดไม่สำเร็จ: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function reset() {
  rowsEl.innerHTML = '';
  for (let i = 0; i < DEFAULT_ROWS; i++) addRow();
  $('title').value = 'แผนที่ประเทศไทย';
  $('theme').value = 'blue';
  $('showAll').checked = true;
  $('showValues').checked = true;
  closePop();
  lastScene = null;
  $('dlBtn').disabled = true;
  render([]);
  setStatus('');
}

/* ---------- init ---------- */
$('theme').innerHTML = Object.entries(THEMES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
$('addBtn').addEventListener('click', () => {
  const row = addRow();
  if (!row) return;
  rowsEl.scrollTop = rowsEl.scrollHeight;
  row.querySelector('input.prov').focus();
});
$('runBtn').addEventListener('click', process);
$('dlBtn').addEventListener('click', download);
$('resetBtn').addEventListener('click', reset);
// changing look-only options re-renders immediately once a map exists
['theme', 'showAll', 'showValues', 'title'].forEach(id => $(id).addEventListener(id === 'title' ? 'input' : 'change', () => { if (lastScene) process(); }));
reset();
</script>
</body>
</html>
